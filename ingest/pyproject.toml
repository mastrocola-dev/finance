[project]
name = "finance-ingest"
version = "0.1.0"
description = "Turns household finance files into addressed segments"
requires-python = ">=3.13"
dependencies = [
  "mcp>=2.3.0",
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "SIM", "RUF", "PT"]
