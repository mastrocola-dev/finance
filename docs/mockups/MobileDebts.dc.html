<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dívidas, reservas e metas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Geist, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Dívidas e reservas</h1>
      <span style="font-size: 13px; color: {{t.muted}}">Patrimônio líquido estimado <strong style="font-family: 'Geist Mono', ui-monospace, monospace; color: {{t.text}}; font-weight: 500">− R$ 12.900,00</strong></span>
    </header>

    <section aria-labelledby="debts" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline">
        <h2 id="debts" style="margin: 0; font-size: 15px; font-weight: 600">Dívidas</h2>
        <span style="margin-left: auto; font-size: 13px; color: {{t.muted}}">R$ 2.000,00/mês</span>
      </div>
      <sc-for list="{{debts}}" as="d" hint-placeholder-count="2">
        <article style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-weight: 600">{{d.name}}</span>
            <span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">{{d.balance}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); gap: 2px" role="img" aria-label="{{d.label}}">
            <sc-for list="{{d.ticks}}" as="k" hint-placeholder-count="48">
              <span style="height: 10px; border-radius: 2px; background: {{k.bg}}"></span>
            </sc-for>
          </div>
          <div style="display: flex; font-size: 12px; color: {{t.muted}}; gap: 8px; flex-wrap: wrap">
            <span>{{d.progress}}</span><span style="margin-left: auto">{{d.meta}}</span>
          </div>
        </article>
      </sc-for>
    </section>

    <section aria-labelledby="reserves" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="reserves" style="margin: 0; font-size: 15px; font-weight: 600">Reservas e metas</h2>
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="2">
        <article style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: center">
          <div style="flex: none; width: 64px; height: 64px; border-radius: 999px; background: conic-gradient({{g.ring}} 0 {{g.deg}}, {{t.sunken}} {{g.deg}} 360deg); display: flex; align-items: center; justify-content: center" role="img" aria-label="{{g.pct}} da meta">
            <span style="width: 50px; height: 50px; border-radius: 999px; background: {{t.surface}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{g.pct}}</span>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 600">{{g.name}}</span>
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-variant-numeric: tabular-nums">{{g.value}}</span>
            <span style="font-size: 12px; color: {{t.muted}}">{{g.meta}}</span>
          </div>
        </article>
      </sc-for>
      <button style="min-height: 44px; border-radius: 10px; border: 1px dashed {{t.border}}; background: transparent; color: {{t.accent}}; font-weight: 500">+ Nova meta</button>
    </section>
  </div>

  <nav aria-label="Principal" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 8px 8px 20px; background: {{t.surface}}; border-top: 1px solid {{t.border}}">
    <a href="MobileOverview.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.muted}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>
      <span>Início</span>
    </a>
    <a href="MobileBills.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.muted}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="m8 12 3 3 5-6"></path></svg>
      <span>Contas</span>
    </a>
    <a href="Entries.dc.html" aria-label="Novo lançamento" style="min-height: 48px; display: flex; align-items: center; justify-content: center">
      <span style="width: 52px; height: 52px; border-radius: 16px; background: {{t.accent}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
    </a>
    <a href="MobileDecisions.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.muted}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M5 7h14M7 7l-3 7h6zM17 7l-3 7h6z"></path></svg>
      <span>Decisões</span>
    </a>
    <a href="MobileDebts.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.accent}}; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M9.5 10.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.6c0 2.4-5 1.2-5 3.6 0 1 1 1.8 2.5 1.8s2.5-.6 2.5-1.6"></path></svg>
      <span>Reservas</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = { bg: '#F6F6F3', surface: '#FFFFFF', sunken: '#ECECE7', border: '#E3E3DD', text: '#15171C', muted: '#5B606B', accent: '#2B54D9', accentText: '#FFFFFF', ok: '#1F6F4A', expense: '#B4440E', next: '#E7B89A' };
    const dark = { bg: '#0E1014', surface: '#161920', sunken: '#232731', border: '#2A2E37', text: '#ECEDEF', muted: '#A0A6B1', accent: '#8BA6FF', accentText: '#0E1014', ok: '#73D3A2', expense: '#F08A4B', next: '#7A4A2E' };
    const t = this.props.dark ? dark : light;
    const ticks = (total, paid) => Array.from({ length: 48 }, (_, i) => ({
      bg: i >= total ? 'transparent' : i < paid ? t.expense : i === paid ? t.next : t.sunken,
    }));
    const debts = [
      { name: 'Financiamento do carro', balance: 'R$ 45.000,00', ticks: ticks(48, 17), progress: '17 de 48 pagas · próxima 28/10', meta: 'R$ 1.500,00 · 1,19% a.m.', label: '17 de 48 parcelas pagas' },
      { name: 'Crédito pessoal (reforma)', balance: 'R$ 8.500,00', ticks: ticks(24, 7), progress: '7 de 24 pagas · próxima 12/11', meta: 'R$ 500,00 · 2,05% a.m.', label: '7 de 24 parcelas pagas' },
    ];
    const goal = (name, pct, value, meta, ring) => ({ name, pct: `${pct}%`, deg: `${Math.round(pct * 3.6)}deg`, value, meta, ring });
    const goals = [
      goal('Reserva de emergência', 54, 'R$ 32.400,00 de R$ 60.000,00', 'Tesouro Selic · + R$ 1.500,00/mês · meta em ago/2028', t.ok),
      goal('Viagem ao Japão', 33, 'R$ 8.200,00 de R$ 25.000,00', 'Gabriela · prazo out/2027 · faltam R$ 1.400,00/mês', t.accent),
    ];
    return { t, debts, goals };
  }
}
</script>
</body>
</html>
