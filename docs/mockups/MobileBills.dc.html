<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Contas do mês</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Geist, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px; background: {{t.bg}}">
    <div style="display: flex; align-items: baseline">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Contas do mês</h1>
      <span style="margin-left: auto; font-size: 13px; color: {{t.muted}}">outubro</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; font-size: 13px"><span>{{paidCount}} de {{total}} pagas</span><span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, monospace; color: {{t.muted}}">falta {{openAmount}}</span></div>
      <div style="height: 8px; border-radius: 999px; background: {{t.sunken}}; overflow: hidden" role="img" aria-label="{{progressLabel}}"><div style="width: {{progress}}; height: 100%; background: {{t.ok}}"></div></div>
    </div>
  </header>

  <ul style="flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{bills}}" as="b" hint-placeholder-count="12">
      <li>
        <button onClick="{{b.toggle}}" aria-pressed="{{b.pressed}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid {{b.border}}; background: {{t.surface}}; color: {{t.text}}; text-align: left">
          <span style="flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid {{b.boxBorder}}; background: {{b.boxBg}}; color: {{t.surface}}; display: flex; align-items: center; justify-content: center" aria-hidden="true">
            <sc-if value="{{b.paid}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 500; color: {{b.nameColor}}">{{b.name}}</span>
            <span style="font-size: 12px; color: {{b.metaColor}}">{{b.meta}}</span>
          </span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; color: {{b.nameColor}}">{{b.amount}}</span>
        </button>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Principal" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 8px 8px 20px; background: {{t.surface}}; border-top: 1px solid {{t.border}}">
    <a href="MobileOverview.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.muted}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>
      <span>Início</span>
    </a>
    <a href="MobileBills.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.accent}}; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="m8 12 3 3 5-6"></path></svg>
      <span>Contas</span>
    </a>
    <a href="Entries.dc.html" aria-label="Novo lançamento" style="min-height: 48px; display: flex; align-items: center; justify-content: center">
      <span style="width: 52px; height: 52px; border-radius: 16px; background: {{t.accent}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
    </a>
    <a href="MobileDecisions.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.muted}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M5 7h14M7 7l-3 7h6zM17 7l-3 7h6z"></path></svg>
      <span>Decisões</span>
    </a>
    <a href="MobileDebts.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{t.muted}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M9.5 10.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.6c0 2.4-5 1.2-5 3.6 0 1 1 1.8 2.5 1.8s2.5-.6 2.5-1.6"></path></svg>
      <span>Reservas</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paid: { 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true, 8: true, 9: true } };
  }
  renderVals() {
    const light = { bg: '#F6F6F3', surface: '#FFFFFF', sunken: '#ECECE7', border: '#E3E3DD', text: '#15171C', muted: '#5B606B', accent: '#2B54D9', accentText: '#FFFFFF', ok: '#1F6F4A', late: '#9A3A0B', lateBorder: '#E9B597' };
    const dark = { bg: '#0E1014', surface: '#161920', sunken: '#232731', border: '#2A2E37', text: '#ECEDEF', muted: '#A0A6B1', accent: '#8BA6FF', accentText: '#0E1014', ok: '#73D3A2', late: '#F5A574', lateBorder: '#6A3A22' };
    const t = this.props.dark ? dark : light;
    const list = [
      [10, 'Plano de saúde', 'venceu 15/10 · Conjunto', 75000, true],
      [11, 'Fatura Nubank', 'vence 25/10 · Marcio · •• 4821', 241850],
      [12, 'Financiamento do carro', 'vence 28/10 · parcela 18 de 48', 150000],
      [1, 'Aluguel', 'pago 05/10 · Conjunto', 380000],
      [2, 'Condomínio', 'pago 10/10 · Conjunto', 105000],
      [3, 'Escola de inglês', 'pago 10/10 · Gabriela · 7 de 12', 165000],
      [4, 'Energia', 'pago 18/10 via Claude · Conjunto', 41230],
      [5, 'Internet', 'pago 15/10 · Conjunto', 12990],
      [6, 'Crédito pessoal (reforma)', 'pago 12/10 · parcela 7 de 24', 50000],
      [7, 'Academia', 'pago 08/10 · Gabriela', 18900],
      [8, 'Streaming e apps', 'pago 06/10 · Conjunto', 15800],
      [9, 'Seguro do carro', 'pago 09/10 · Marcio', 28600],
    ];
    const brl = (c) => 'R$ ' + (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    const bills = list.map(([id, name, meta, cents, overdue]) => {
      const paid = !!this.state.paid[id];
      const late = overdue && !paid;
      return {
        name, amount: brl(cents), paid, pressed: paid ? 'true' : 'false',
        meta: late ? 'Atrasada · ' + meta : paid && overdue ? 'pago agora · Marcio' : meta,
        metaColor: late ? t.late : t.muted,
        nameColor: paid ? t.muted : t.text,
        border: late ? t.lateBorder : t.border,
        boxBorder: paid ? t.ok : late ? t.late : t.muted,
        boxBg: paid ? t.ok : 'transparent',
        toggle: () => this.setState({ paid: { ...this.state.paid, [id]: !paid } }),
      };
    });
    const paidCount = bills.filter((b) => b.paid).length;
    const open = list.filter(([id]) => !this.state.paid[id]).reduce((sum, row) => sum + row[3], 0);
    const pct = Math.round((paidCount / list.length) * 100);
    return { t, bills, paidCount, total: list.length, openAmount: brl(open), progress: pct + '%', progressLabel: pct + '% das contas pagas' };
  }
}
</script>
</body>
</html>
