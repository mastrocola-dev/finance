name: deploy

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan and run the migrations
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-finance-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: 'true'
  TF_VAR_entra_issuer: ${{ vars.ENTRA_ISSUER }}
  TF_VAR_entra_audience: ${{ vars.ENTRA_AUDIENCE }}
  TF_VAR_entra_web_client_id: ${{ vars.ENTRA_WEB_CLIENT_ID }}
  TF_VAR_mcp_scopes: ${{ vars.MCP_SCOPES || '[]' }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  COMMIT: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
  APPLY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_run' || inputs.apply) }}

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Images
        run: |
          set -euo pipefail
          echo "TF_VAR_api_image=ghcr.io/mastrocola-dev/finance-api:$COMMIT" >> "$GITHUB_ENV"
          echo "TF_VAR_mcp_image=ghcr.io/mastrocola-dev/finance-mcp:$COMMIT" >> "$GITHUB_ENV"
          echo "TF_VAR_extract_image=ghcr.io/mastrocola-dev/finance-extract:$COMMIT" >> "$GITHUB_ENV"
      - name: Images published
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          docker manifest inspect "$TF_VAR_api_image" > /dev/null
          docker manifest inspect "$TF_VAR_mcp_image" > /dev/null
          docker manifest inspect "$TF_VAR_extract_image" > /dev/null
      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init \
            -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate-finance" \
            -backend-config="key=finance.tfstate" \
            -backend-config="use_azuread_auth=true"
      - name: Terraform plan
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan
      - name: Terraform apply
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan
      - uses: azure/login@v3
        if: env.APPLY == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrate
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          group=$(terraform output -raw resource_group)
          job=$(terraform output -raw migrate_job)
          execution=$(az containerapp job start --name "$job" --resource-group "$group" --query name --output tsv)
          status=Unknown
          for _ in $(seq 90); do
            sleep 10
            status=$(az containerapp job execution show --name "$job" --resource-group "$group" --job-execution-name "$execution" --query properties.status --output tsv)
            case "$status" in Succeeded | Failed | Stopped | Degraded) break ;; esac
          done
          echo "Migration \`$execution\`: $status" >> "$GITHUB_STEP_SUMMARY"
          test "$status" = Succeeded
      - name: Summary
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          echo "Deployed \`$COMMIT\` to $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"
